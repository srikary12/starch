name: CI

# Everyone installs Starch by building it, so a build that only works on the
# author's machine is a broken release. This runs the same targets a user runs.

# Pull requests only. main is protected, so every change arrives as a PR and is
# tested there — a post-merge run re-tests a tree that has already passed, and
# through the concurrency group below it also cancels anything still running.
#
# workflow_dispatch stays deliberately: a direct push made under an admin bypass
# is the one path this leaves untested, and this is how to check it by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    # Pinned rather than macos-latest: Swift 6 needs Xcode 16+, and an image
    # bump that quietly moves the default toolchain should break on a day we
    # choose, not on a day GitHub chooses.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # vet also enforces gofmt, so a formatting drift fails here rather than
      # in review.
      - run: make vet

      - name: Tests, with the race detector
        run: go test -race ./...

  swift:
    name: Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain in use
        run: |
          xcode-select -p
          swift --version

      - run: make test-swift

  bundle:
    name: App bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build universal
        run: make app ARCH=universal VERSION=0.0.0-ci

      - name: The bundle has to be what it claims
        run: |
          set -euo pipefail
          APP=apps/macos/build/Starch.app

          # Both slices, both binaries. A universal build that quietly produced
          # one architecture would only be discovered by an Intel user.
          for bin in "$APP/Contents/MacOS/Starch" "$APP/Contents/Resources/starchd"; do
            echo "== $bin"
            lipo -info "$bin"
            lipo -info "$bin" | grep -q 'arm64' || { echo "missing arm64"; exit 1; }
            lipo -info "$bin" | grep -q 'x86_64' || { echo "missing x86_64"; exit 1; }
          done

          # The version is substituted by sed. If that ever silently fails we
          # would ship a bundle whose version reads "__VERSION__", and nothing
          # else in the build would notice.
          plist="$APP/Contents/Info.plist"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          echo "CFBundleShortVersionString = $version"
          [ "$version" = "0.0.0-ci" ] || { echo "version was not substituted"; exit 1; }

          # Signed inside out, and the seal intact.
          codesign --verify --strict --verbose=2 "$APP"

  linux-shell:
    name: Linux shell
    # The only place this is built and run. It is developed on a Mac, where it
    # compiles and its tests pass, but "compiles on a Mac" is not the claim —
    # the claim is that it works on Linux, and this is what checks it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: A session bus for the keyring tests
        # Without dbus-daemon the Secret Service tests skip themselves rather
        # than fail, which would quietly leave the keyring untested. Installing
        # it is how the skip stays a real signal.
        run: |
          set -euo pipefail
          command -v dbus-daemon || sudo apt-get install -y --no-install-recommends dbus
          dbus-daemon --version | head -1

      - run: make -C apps/desktop vet

      - name: Tests, with the race detector
        run: make -C apps/desktop test

      - name: The keyring tests really ran
        # A skipped test reads as a pass. This is the one suite that depends on
        # something outside the repository, so it is worth asserting.
        run: |
          set -euo pipefail
          cd apps/desktop
          go test -count=1 -v -run TestALockedKeyringIsUnlocked ./internal/secret/ | tee /tmp/keyring.log
          grep -q -- '--- PASS: TestALockedKeyringIsUnlocked' /tmp/keyring.log

      - name: Builds for every Linux target we claim
        run: |
          set -euo pipefail
          cd apps/desktop
          for arch in amd64 arm64; do
            echo "== linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/starch
          done

      - name: The shell and daemon install together
        # Locate() looks for starchd next to the shell first, so the install
        # layout is part of the contract between them.
        run: |
          set -euo pipefail
          make linux-install PREFIX="$PWD/staging"
          test -x staging/bin/starch
          test -x staging/bin/starchd
          staging/bin/starch version

  windows-shell:
    name: Windows shell
    # The only place any of the Windows code runs. It is written on a Mac,
    # where it cross-compiles and type-checks but cannot execute a single
    # syscall of what it is actually made of, so "it compiles" is not the claim
    # being tested here.
    runs-on: windows-latest
    defaults:
      run:
        # Git for Windows ships bash, and using it keeps these steps readable
        # and close to the Linux job's. make is not on the image.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: |
          set -euo pipefail
          go vet ./...
          (cd apps/desktop && go vet ./...)
          # gofmt walks directories, not modules, so "." already covers
          # apps/desktop — naming it again would list every file twice.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: The daemon's own suite, on Windows
        # First time this has run here. The socket code is the interesting
        # part: AF_UNIX works, and a stale socket file is now the common case
        # rather than an edge one, because there is no graceful stop to send on
        # this platform so the daemon never gets to unlink its own.
        run: go test ./...

      - name: The shell's suite
        # No -race: it requires cgo everywhere except macOS, and the whole
        # point of this shell is that it needs no C toolchain. The shared
        # packages are raced in the macOS and Linux jobs, which is where the
        # concurrency actually lives.
        run: cd apps/desktop && go test ./...

      - name: Credential Manager and the job object really ran
        # Both talk to the real OS — there is no service to fake — so they are
        # the two suites that only exist here. A silently skipped test reads as
        # a pass, so assert they did not skip.
        run: |
          set -euo pipefail
          cd apps/desktop
          go test -count=1 -v ./internal/secret/ ./internal/win32/ | tee /tmp/windows.log
          grep -q -- '--- PASS: TestSetGetDelete' /tmp/windows.log
          grep -q -- '--- PASS: TestEnsureOwnerOnlyDirNamesOnlyThisUser' /tmp/windows.log
          grep -q -- '--- PASS: TestConfineToShellLifetime' /tmp/windows.log

      - name: Builds for every Windows target we claim
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "== windows/$arch"
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/starchd
            (cd apps/desktop && CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/starch)
          done

      - name: The whole loop, without a desktop
        # This is the step worth having. It exercises the parts that only exist
        # on Windows and that no unit test reaches: the socket directory's
        # access list, the job object, spawning and supervising starchd over
        # AF_UNIX, and a streamed rewrite end to end. The provider is a stub, so
        # nothing leaves the runner and no key is needed.
        run: |
          set -euo pipefail
          mkdir -p build
          CGO_ENABLED=0 go build -o build/starchd.exe ./cmd/starchd
          (cd apps/desktop && CGO_ENABLED=0 go build -o ../../build/starch.exe ./cmd/starch)

          cat > provider.py <<'PY'
          import http.server, json, socketserver, sys
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.rfile.read(int(self.headers['Content-Length']))
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/event-stream')
                  self.end_headers()
                  for piece in ["Thanks ", "for the ", "update."]:
                      self.wfile.write(b"data: " + json.dumps(
                          {"choices": [{"delta": {"content": piece}}]}).encode() + b"\n\n")
                      self.wfile.flush()
                  self.wfile.write(b"data: [DONE]\n\n")
                  self.wfile.flush()
              def log_message(self, *a): pass
          srv = socketserver.TCPServer(("127.0.0.1", 0), H)
          print(srv.server_address[1], flush=True)
          srv.serve_forever()
          PY

          python provider.py > port.txt &
          for _ in $(seq 1 30); do [ -s port.txt ] && break; sleep 1; done
          PORT=$(cat port.txt)
          echo "stub provider on 127.0.0.1:$PORT"

          export STARCH_DAEMON="$PWD/build/starchd.exe"
          ./build/starch.exe config \
            --provider openai_compatible \
            --endpoint "http://127.0.0.1:$PORT/v1" \
            --model smoke-test-model

          printf 'thx for the update' | ./build/starch.exe rewrite | tee rewrite.txt
          grep -q 'Thanks for the update.' rewrite.txt

      - name: Nothing was left holding a key
        # The daemon must not outlive the command that spawned it. On Windows
        # that guarantee comes from the job object rather than from a signal or
        # from reparenting, neither of which exists here.
        run: |
          set -euo pipefail
          sleep 2
          if tasklist | grep -i starchd; then
            echo "a daemon outlived its shell"; exit 1
          fi
          echo "no starchd running"

  portability:
    name: Daemon cross-compiles
    # The Go layer is written assuming Windows and Linux shells are coming.
    # That claim is worth nothing unless something checks it, and it costs one
    # cheap Linux job to keep honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the daemon for every target we claim
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            echo "== $target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o /dev/null ./cmd/starchd
          done

      - name: Tests on Linux
        # The daemon has no macOS-specific code. If that stops being true, this
        # is where it shows up.
        run: go test ./...
